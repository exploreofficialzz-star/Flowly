name: Flowly — Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.27.0'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: 🤖 Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Generate splash & icons
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons

      - name: Setup keystore
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS:       ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD:    ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD:  ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build universal APK (debug)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug

      - name: Build universal APK (release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release

      - name: Build AAB (release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: flutter build appbundle --release

      - name: Verify builds exist
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          AAB=build/app/outputs/bundle/release/app-release.aab
          if [ ! -f "$APK" ]; then
            echo "❌  APK not found at $APK"; exit 1
          fi
          if [ ! -f "$AAB" ]; then
            echo "❌  AAB not found at $AAB"; exit 1
          fi
          echo "✅  APK — $(du -sh $APK | cut -f1)"
          echo "✅  AAB — $(du -sh $AAB | cut -f1)"

      - name: Upload APK artefact (debug)
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: flowly-apk-debug-${{ github.sha }}
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

      - name: Upload APK + AAB artefacts (release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: flowly-release-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

  build-ios:
    name: 🍎 Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate splash & icons
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons

      - name: Build iOS (no-codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r flowly.ipa Payload

      - name: Upload iOS artefact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: flowly-ipa-${{ github.sha }}
          path: flowly.ipa
          retention-days: 30

  release:
    name: 🚀 Create GitHub Release
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artefacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Flowly ${{ github.ref_name }}
          body: |
            ## Flowly ${{ github.ref_name }}
            **by chAs Tech Group** — `com.chastechgroup.flowly`

            ### 📦 Included builds
            | File | Use |
            |------|-----|
            | `app-release.apk` | ✅ **Universal APK — works on ALL Android phones** |
            | `app-release.aab` | ✅ **Upload this to Google Play** |
            | `flowly.ipa` | iOS (requires code-signing) |

            > The universal APK includes all CPU architectures (arm64, arm32, x86_64)
            > in one file — install it on any Android device directly.
          files: |
            flowly-release-*/app-release.apk
            flowly-release-*/bundle/release/app-release.aab
            flowly-ipa-*/flowly.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

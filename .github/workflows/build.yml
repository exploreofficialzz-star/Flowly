name: Flowly — Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  FLUTTER_VERSION: '3.16.9'
  JAVA_VERSION: '17'

jobs:
  build-android:
    name: 🤖 Build Android APK & AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Run tests
        run: flutter test

      - name: Generate splash & icons
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons

      - name: Setup keystore
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/keystore.jks
          cat > android/key.properties << EOF
          storePassword=$STORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=keystore.jks
          EOF

      - name: Build APK (debug)
        if: github.event_name == 'pull_request'
        run: flutter build apk --debug --split-per-abi

      - name: Build APK (release)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')
        run: flutter build apk --release --split-per-abi

      - name: Build AAB (release)
        if: startsWith(github.ref, 'refs/tags/')
        run: flutter build appbundle --release

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: flowly-apk-${{ github.sha }}
          path: |
            build/app/outputs/flutter-apk/*.apk
            build/app/outputs/bundle/release/*.aab
          retention-days: 30

  build-ios:
    name: 🍎 Build iOS
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate splash & icons
        run: |
          flutter pub run flutter_native_splash:create
          flutter pub run flutter_launcher_icons

      - name: Build iOS (no-codesign)
        run: flutter build ios --release --no-codesign

      - name: Package IPA
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          zip -r flowly.ipa Payload

      - name: Upload iOS artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: flowly-ipa-${{ github.sha }}
          path: flowly.ipa
          retention-days: 30

  release:
    name: 🚀 Create GitHub Release
    needs: [ build-android, build-ios ]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          name: Flowly ${{ github.ref_name }}
          body: |
            ## Flowly ${{ github.ref_name }}
            **by chAs Tech Group** — `com.chastechgroup.flowly`
            - Android APK (arm64, armeabi-v7a, x86_64)
            - Android AAB (Play Store)
            - iOS IPA
          files: |
            flowly-apk-*/flutter-apk/*.apk
            flowly-apk-*/bundle/release/*.aab
            flowly-ipa-*/flowly.ipa
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

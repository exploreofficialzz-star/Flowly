name: flowly
description: Flowly - Color Sort Puzzle Game by chAs Tech Group
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.1
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.8.3
  audioplayers: ^5.2.1
  google_mobile_ads: ^4.0.0
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  google_fonts: ^5.1.0
  flutter_svg: ^2.0.9
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.1
  connectivity_plus: ^6.0.3
  in_app_purchase: ^3.1.13
  webview_flutter: 4.13.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.9

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0E23"
  adaptive_icon_foreground: "assets/images/icon_adaptive_fg.png"
  remove_alpha_ios: true

flutter_native_splash:
  color: "#0A0E23"
  image: assets/images/icon_1024.png
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/

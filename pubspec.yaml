name: flowly
description: Flowly - Color Sort Puzzle Game by chAs Tech Group
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # State management
  provider: ^6.1.1
  # Local storage
  shared_preferences: ^2.2.2
  sqflite: ^2.3.0
  path: ^1.9.0
  # Audio
  audioplayers: ^5.2.1
  # Ads
  google_mobile_ads: ^4.0.0
  # Animations
  flutter_animate: ^4.3.0
  lottie: ^3.0.0
  # UI
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  # Utils
  package_info_plus: ^5.0.1
  url_launcher: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.3.9

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/icon_1024.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0A0E23"
  adaptive_icon_foreground: "assets/images/icon_512.png"

flutter_native_splash:
  color: "#0A0E23"
  image: assets/images/splash.png
  android: true
  ios: true
  fullscreen: true

flutter:
  uses-material-design: true
  assets:
    - assets/audio/
    - assets/images/
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800

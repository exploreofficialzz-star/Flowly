plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// Load keystore credentials from key.properties (never committed to git)
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
} else {
    logger.warn("WARNING: key.properties not found. Release builds will not be signed.")
}

android {
    namespace "com.chastechgroup.flowly"
    compileSdk 36
    ndkVersion "27.0.12077973"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    kotlinOptions {
        jvmTarget = '11'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId   "com.chastechgroup.flowly"
        minSdk          24
        targetSdk       36
        // versionCode and versionName intentionally omitted here.
        // The Flutter Gradle plugin reads them from pubspec.yaml automatically
        // (version: 1.0.2+3  →  versionName "1.0.2", versionCode 3).
        // One source of truth prevents the drift that caused versionCode 2 in
        // build.gradle vs build number 1 in pubspec to diverge silently.
        multiDexEnabled true
    }

    signingConfigs {
        release {
            if (keystorePropertiesFile.exists()) {
                keyAlias      keystoreProperties['keyAlias']
                keyPassword   keystoreProperties['keyPassword']
                storeFile     file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        release {
            signingConfig   signingConfigs.release
            // R8 / ProGuard — required for Play Store
            minifyEnabled   true
            shrinkResources true
            proguardFiles   getDefaultProguardFile('proguard-android-optimize.txt'),
                            'proguard-rules.pro'
        }
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix   "-debug"
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    // Use the same Kotlin version declared in root build.gradle
    implementation "org.jetbrains.kotlin:kotlin-stdlib:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    // NOTE: Do NOT add play-services-ads here — google_mobile_ads plugin
    // manages its own version. Duplicating causes Gradle version conflicts.
}
